# KTU Instant Tune-Up Funnel — Cloudflare Worker
# KV + D1 created 2026-07-18, R2 bucket ktu-tuneup-photos created 2026-08-06
# (real IDs / bindings below).

name = "ktu-tuneup"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# ServiceMinder pricing sync — every 15 minutes (build spec)
[triggers]
crons = ["*/15 * * * *"]

[vars]
SM_SERVICE_ID = "30382" # Tune-Up Residential
META_PIXEL_ID = "109034988941656" # KTU Bloomfield NJ (domain verified)
HIGHLEVEL_LOCATION_ID = "nHLCxHPidnhV1NFzRtZZ" # KTU location (P5 contact fan-out)
# GA4_MEASUREMENT_ID = "G-XXXXXXXXXX" # uncomment once the GA4 property exists

[[kv_namespaces]]
binding = "PRICING_KV"
id = "eac228b23726485389a6236be9f72e0a"

[[d1_databases]]
binding = "DB"
database_name = "ktu-tuneup"
database_id = "e8697721-207d-42d5-8014-c8240b690ee4"

# Customer photos (R2 bucket created 2026-08-06). Photos are used from Phase 2/3.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ktu-tuneup-photos"

# Secrets (set with `wrangler secret put`, never in this file):
#   SERVICEMINDER_API_KEY — Phase 1 (pricing sync)
#   ANTHROPIC_API_KEY     — Phase 2 (vision classifier)
#   HIGHLEVEL_API_KEY     — P4 payments + P5 contact upsert (KTU Private Integration Token)
#   HIGHLEVEL_PAYMENT_URL — P4 deposit link config (owner provides)
#   META_CAPI_TOKEN       — P5 Meta Conversions API access token
#   GA4_API_SECRET        — P5 GA4 Measurement Protocol secret
